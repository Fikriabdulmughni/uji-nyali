name: Export APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_RELEASE: 4.7.2-stable
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Godot dan export templates
        run: |
          set -e
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -L -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot
          unzip -q templates.tpz -d tpl
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL_DIR"
          mv tpl/templates/* "$TPL_DIR/"

      - name: Ambil godot-lib dari android_source
        run: |
          set -e
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/src"
          unzip -q "$TPL_DIR/android_source.zip" -d "$HOME/src"
          mkdir -p android/build/libs/debug android/build/libs/release
          find "$HOME/src" -name "godot-lib.template_debug.aar" -exec cp {} android/build/libs/debug/ \;
          find "$HOME/src" -name "godot-lib.template_release.aar" -exec cp {} android/build/libs/release/ \;
          ls -la android/build/libs/debug android/build/libs/release

      - name: Import dan export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e
          chmod +x android/build/gradlew
          mkdir -p build
          "$HOME/godot/godot" --headless --path . --import
          "$HOME/godot/godot" --headless --path . --export-debug "Android" build/uji-nyali.apk

      - uses: actions/upload-artifact@v4
        with:
          name: uji-nyali-apk
          path: build/uji-nyali.apk
